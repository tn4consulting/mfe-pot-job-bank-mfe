name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets mfe-pot/tools/deploy-eks.sh re-trigger this repo's deploy-eks job
  # on demand (e.g. right after a fresh cluster comes up) without needing
  # a new commit -- deploy-eks otherwise only fires on a push to main.
  # Defaults to skip_build=true: a manual dispatch's whole point is usually
  # "redeploy the commit that's already on main, using the image that same
  # commit's own push-triggered run already published to GHCR" -- rerunning
  # lint-test-build/build-images/kind-validation for that would be pure
  # waste. mfe-pot/tools/build-all.sh explicitly passes skip_build=false
  # for the opposite case: force a fresh build+publish without deploying.
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip lint/build/kind-validation and just deploy the already-published image (set false to force a rebuild without deploying)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.0'
  PNPM_VERSION: '10.33.2'

permissions:
  contents: read
  packages: read

jobs:
  # Stage 1: lint/test/build, matching `nx run-many -t lint,test,build --all`
  # from local dev (see CLAUDE.md). @tn4consulting/* resolves from GitHub
  # Packages via .npmrc; GITHUB_TOKEN works for same-org package reads.
  lint-test-build:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      # Catches Native-Federation-shared-singleton drift (react/react-dom/
      # shared-ui-scds-core/shared-federation-runtime/shared-federation-config
      # vs mfe-pot-platform/platform-versions.json) before it becomes a
      # silent runtime failure -- see
      # mfe-pot/docs/plans/20260808-1200-multi-team-scale-governance.md.
      # --check-critical-prs needs gh authenticated; GITHUB_TOKEN covers
      # read-only PR listing on this repo with no extra secret.
      - name: Check platform-versions.json alignment
        run: pnpm run check:versions -- --check-critical-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Enforces the BFF/UI call-boundary design principles -- see
      # mfe-pot/TODO.md's "Design principles" section and
      # docs/PLATFORM_STANDARDS.md's "BFF boundary rules".
      - name: Check BFF/UI call boundaries
        run: pnpm run check:boundaries

      - name: Lint, test, build
        run: pnpm exec nx run-many -t lint,test,build --all

      # job-bank-bff's lint target is inferred as `eslint:lint`, not `lint`
      # (the @nx/node generator doesn't add an explicit `lint` target the
      # way the Angular app does) -- see CLAUDE.md's "Backends: BFF
      # pattern" section. `nx run-many -t lint` above silently skips it.
      - name: Lint job-bank-bff
        run: pnpm exec nx run job-bank-bff:eslint:lint

  # Stage 1.5: build both images from source exactly once, push to GHCR
  # (this repo's own GITHUB_TOKEN, no per-cloud credential needed). Both
  # kind-validation and deploy-eks below pull-and-retag this single build
  # instead of each independently rebuilding from source -- see
  # /Users/martin/.claude/plans/create-a-plan-for-cozy-globe.md for the
  # full design.
  build-images:
    needs: lint-test-build
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/build-push-action's `secrets:` input is line-oriented
      # (one `key=value` pair per line) -- a genuinely multi-line value
      # like a PEM private key gets truncated at its first embedded
      # newline (confirmed live: CI failed with `ERR_OSSL_ASN1_NOT_ENOUGH_DATA`,
      # importPKCS8 choking on a key cut off after "-----BEGIN PRIVATE
      # KEY-----"). Writing it to a runner-local file first and passing
      # that via `secret-files:` instead sidesteps the line-oriented
      # format entirely -- the Dockerfile's own `--mount=type=secret`
      # step needs no change, BuildKit provides a file at
      # /run/secrets/remote_signing_key either way.
      - name: Write signing key to a temp file
        env:
          REMOTE_SIGNING_PRIVATE_KEY: ${{ secrets.REMOTE_SIGNING_PRIVATE_KEY }}
        run: printf '%s' "$REMOTE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/remote_signing_key.pem"

      - name: Build and push job-bank-mfe image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/job-bank-mfe/Dockerfile
          push: true
          tags: ghcr.io/tn4consulting/mfe-pot-job-bank-mfe:${{ github.sha }}
          # REMOTE_SIGNING_KID is not secret (see the Dockerfile's own
          # comment on this step) -- it's how a shell picks which
          # trust-registry entry to verify a signature against, so it's a
          # plain build-arg, not a second secret alongside
          # remote_signing_key below.
          build-args: |
            REMOTE_SIGNING_KID=${{ vars.REMOTE_SIGNING_KID }}
          secrets: |
            npm_token=${{ secrets.NPM_READ_TOKEN }}
          secret-files: |
            remote_signing_key=${{ runner.temp }}/remote_signing_key.pem

      - name: Clean up signing key temp file
        if: always()
        run: rm -f "$RUNNER_TEMP/remote_signing_key.pem"

      - name: Build and push job-bank-bff image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/job-bank-bff/Dockerfile
          push: true
          tags: ghcr.io/tn4consulting/mfe-pot-job-bank-bff:${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.NPM_READ_TOKEN }}

  # Stage 2: deploy this app's own Helm chart to an ephemeral kind cluster,
  # and confirm it actually serves -- the kind-based validation stage from
  # CLAUDE.md's Hosting section, now automated instead of the one-off
  # manual run it started as.
  kind-validation:
    needs: build-images
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: mfe-pot-job-bank-mfe

      # charts/job-bank-mfe/Chart.yaml's library-chart dependencies resolve
      # via a sibling-checkout-relative file:// path (see CLAUDE.md) --
      # checked out alongside this repo so the same relative layout local
      # dev uses (both under one parent directory) holds here too. Public
      # repo, so the default GITHUB_TOKEN reads it with no extra secret.
      - name: Checkout mfe-pot-platform (sibling - Helm library charts + kind config)
        uses: actions/checkout@v4
        with:
          repository: tn4consulting/mfe-pot-platform
          path: mfe-pot-platform

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # workflow-level permissions.packages: read already covers this
          # pull -- this job has no job-level permissions override.

      - name: Pull and retag images from GHCR for kind
        run: |
          docker pull ghcr.io/tn4consulting/mfe-pot-job-bank-mfe:${{ github.sha }}
          docker tag ghcr.io/tn4consulting/mfe-pot-job-bank-mfe:${{ github.sha }} mfe-pot-job-bank-mfe:kind
          docker pull ghcr.io/tn4consulting/mfe-pot-job-bank-bff:${{ github.sha }}
          docker tag ghcr.io/tn4consulting/mfe-pot-job-bank-bff:${{ github.sha }} mfe-pot-job-bank-bff:kind

      # Pinned node image: this environment's Docker daemon (cgroup v1)
      # can't kubeadm-init kind's current default node image (built for
      # k8s 1.36) -- see CLAUDE.md. Kept pinned here too for consistency
      # with the proven local recipe, even though GitHub-hosted runners
      # typically run cgroup v2 and may not need the pin.
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind
          config: mfe-pot-platform/tools/k8s/kind-config.yaml
          node_image: kindest/node:v1.27.3
          wait: 120s

      - name: Install ingress-nginx (kind flavour)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s

      - name: Load images into kind
        run: |
          kind load docker-image mfe-pot-job-bank-mfe:kind
          kind load docker-image mfe-pot-job-bank-bff:kind

      - uses: azure/setup-helm@v4

      # job-bank-bff's readinessProbe (GET /ready) genuinely round-trips
      # Redis now (see mfe-pot/TODO.md's "Design principles" section,
      # principle 3/4) -- without a real session-cache reachable, the pod
      # can never become Ready and `helm install --wait` below times out.
      # This doesn't reintroduce a cross-repo *build* dependency (still
      # only this repo's own image/chart is built and verified) -- just a
      # real runtime one, same shape the real deploy-local.sh already
      # requires.
      - name: Deploy session-cache (dependency for job-bank-bff's real readiness check)
        run: |
          helm install session-cache mfe-pot-platform/charts/session-cache \
            -f mfe-pot-platform/charts/session-cache/values.yaml \
            -f mfe-pot-platform/charts/session-cache/values-kind.yaml \
            --wait --timeout 60s

      - name: helm dependency update
        run: helm dependency update mfe-pot-job-bank-mfe/charts/job-bank-mfe

      - name: helm install job-bank-mfe
        run: |
          helm install job-bank-mfe mfe-pot-job-bank-mfe/charts/job-bank-mfe \
            -f mfe-pot-job-bank-mfe/charts/job-bank-mfe/values.yaml \
            -f mfe-pot-job-bank-mfe/charts/job-bank-mfe/values-kind.yaml \
            --wait --timeout 120s

      # Same checks proven manually (see CLAUDE.md/the platform repo's
      # plan doc): the frontend actually serves, the ConfigMap-injected
      # runtime config round-tripped (not the image's {} placeholder),
      # and the BFF is reachable through the same Ingress via /api.
      - name: Verify the deployed app is actually reachable
        run: |
          set -eu
          # helm install --wait only waits for the pod to be Ready, not for
          # ingress-nginx's own reconciliation loop to pick up the new
          # Ingress resource -- give it a few seconds before asserting.
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: job-bank-mfe.mfe-pot.local" http://localhost/ || echo 000)
            [ "$status" = "200" ] && break
            sleep 2
          done
          curl -sf -H "Host: job-bank-mfe.mfe-pot.local" http://localhost/ | grep -qi '<script src="env.js">'
          curl -sf -H "Host: job-bank-mfe.mfe-pot.local" http://localhost/env.js | grep -q '"jobBankBffBaseUrl":""'
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: job-bank-mfe.mfe-pot.local" "http://localhost/api/jobs")
          [ "$status" = "200" ]

  # Stage 3: mirror the images build-images already pushed to GHCR into ECR
  # (pull+retag+push, not a rebuild), and deploy to the real AWS EKS
  # cluster, on push to main only. See
  # mfe-pot/docs/plans/20260808-1500-mfe-pot-aws-eks-terraform.md for the
  # full design. The demo cluster is intentionally torn down between demos
  # (cost-conscious PoC, see that doc's "Cost posture" decision) -- most
  # pushes to main happen while it doesn't exist, so every step past the
  # liveness check is individually gated on `steps.check.outputs.cluster_up`
  # rather than skipping the whole job, which would make an unconditional
  # deploy step fail loudly and routinely.
  deploy-eks:
    needs: [lint-test-build, kind-validation]
    # always() is required here: on the default workflow_dispatch path
    # (skip_build=true), lint-test-build/kind-validation are intentionally
    # skipped by their own `if:` above, and a job's needs are only
    # considered satisfied-by-default when every needed job actually
    # succeeded -- without always(), GitHub would skip this job too. The
    # two branches below re-derive the safety this would otherwise lose:
    # on a real push, still require kind-validation to have genuinely
    # succeeded (so a real lint/build/kind failure still blocks the real
    # EKS deploy, exactly as before); on workflow_dispatch, only proceed
    # when kind-validation was the *intentional* skip_build=true skip
    # (result == 'skipped'), not some other event entirely -- and never
    # when skip_build=false (mfe-pot/tools/build-all.sh's build-only mode,
    # which must never deploy).
    if: >-
      always() && github.ref == 'refs/heads/main' && ((github.event_name == 'push' &&
      needs.kind-validation.result == 'success') || (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.skip_build != 'false' && needs.kind-validation.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: mfe-pot-job-bank-mfe

      - name: Checkout mfe-pot-platform (sibling - Helm library charts)
        uses: actions/checkout@v4
        with:
          repository: tn4consulting/mfe-pot-platform
          path: mfe-pot-platform

      - name: Configure AWS credentials (GitHub OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check whether the demo cluster currently exists
        id: check
        continue-on-error: true
        run: |
          if aws eks describe-cluster --name "${{ vars.EKS_CLUSTER_NAME }}" >/dev/null 2>&1; then
            echo "cluster_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "cluster_up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        if: steps.check.outputs.cluster_up == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ECR repos here have immutable tags, and the tag is the commit SHA --
      # re-triggering this job for a commit already deployed once (e.g.
      # mfe-pot/tools/deploy-eks.sh re-pointing a freshly recreated cluster
      # at already-built images) would otherwise fail the build-push step
      # outright rather than just reusing what's already there.
      - name: Check if job-bank-mfe image already exists in ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: image-exists-mfe
        run: |
          if aws ecr describe-images --repository-name mfe-pot-job-bank-mfe --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror job-bank-mfe image from GHCR to ECR
        if: steps.check.outputs.cluster_up == 'true' && steps.image-exists-mfe.outputs.exists != 'true'
        run: |
          docker pull ghcr.io/tn4consulting/mfe-pot-job-bank-mfe:${{ github.sha }}
          docker tag ghcr.io/tn4consulting/mfe-pot-job-bank-mfe:${{ github.sha }} ${{ steps.ecr-login.outputs.registry }}/mfe-pot-job-bank-mfe:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/mfe-pot-job-bank-mfe:${{ github.sha }}

      - name: Check if job-bank-bff image already exists in ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: image-exists-bff
        run: |
          if aws ecr describe-images --repository-name mfe-pot-job-bank-bff --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror job-bank-bff image from GHCR to ECR
        if: steps.check.outputs.cluster_up == 'true' && steps.image-exists-bff.outputs.exists != 'true'
        run: |
          docker pull ghcr.io/tn4consulting/mfe-pot-job-bank-bff:${{ github.sha }}
          docker tag ghcr.io/tn4consulting/mfe-pot-job-bank-bff:${{ github.sha }} ${{ steps.ecr-login.outputs.registry }}/mfe-pot-job-bank-bff:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/mfe-pot-job-bank-bff:${{ github.sha }}

      - name: Update kubeconfig
        if: steps.check.outputs.cluster_up == 'true'
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@v4
        if: steps.check.outputs.cluster_up == 'true'

      - name: helm dependency update
        if: steps.check.outputs.cluster_up == 'true'
        run: helm dependency update mfe-pot-job-bank-mfe/charts/job-bank-mfe

      - name: helm upgrade --install against EKS
        if: steps.check.outputs.cluster_up == 'true'
        run: |
          helm upgrade --install job-bank-mfe mfe-pot-job-bank-mfe/charts/job-bank-mfe \
            -f mfe-pot-job-bank-mfe/charts/job-bank-mfe/values.yaml \
            -f mfe-pot-job-bank-mfe/charts/job-bank-mfe/values-eks.yaml \
            --set frontend.image.tag=${{ github.sha }} \
            --set backend.image.tag=${{ github.sha }} \
            --wait --timeout 180s

      # Longer window than kind-validation's: a brand-new Ingress needs
      # external-dns to notice and propagate the DNS record, plus
      # cert-manager's first DNS-01 ACME issuance -- both near-instant on a
      # redeploy where the record/cert already exist, but not on the very
      # first deploy.
      - name: Verify the deployed app is actually reachable over HTTPS
        if: steps.check.outputs.cluster_up == 'true'
        run: |
          set -eu
          for i in $(seq 1 60); do
            status=$(curl -sk -o /dev/null -w '%{http_code}' https://job-bank-mfe.aws.tn4consulting.com/ || echo 000)
            [ "$status" = "200" ] && break
            sleep 5
          done
          curl -skf https://job-bank-mfe.aws.tn4consulting.com/ | grep -qi '<script src="env.js">'
