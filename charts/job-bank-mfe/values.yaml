frontend:
  name: job-bank-mfe
  # Generalizing the pattern proved live on employment-insurance-mfe --
  # see mfe-pot/TODO.md's "Design principles" section, principles 3/4.
  # Local kind default stays at 1 (limits resource pressure on a
  # single-node dev cluster) -- values-eks.yaml bumps this to 2.
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  image:
    repository: mfe-pot-job-bank-mfe
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 80
  servicePort: 80
  # Same-origin: the BFF is exposed under this same hostname via the /api
  # Ingress path rule below, not a separate hostname -- see CLAUDE.md's
  # Hosting section on why (reduces the real hostname count, makes this
  # call same-origin). Matches apps/job-bank/src/runtime-config.ts's shape.
  # Empty, not "/api": HttpJobBankApiClient already appends "/api/..."
  # itself (`${baseUrl}/api/jobs`), so this value is just "this app's own
  # origin" -- shared-runtime-config's fetchRuntimeConfig resolves "" to
  # that origin. A literal "/api" here double-prefixes every request to
  # /api/api/... and 404s (a real bug, only ever exercised once the
  # runtime-config-over-federation fix started reaching a real BFF).
  # strapiBaseUrl is browser-to-server (ContentClient fetches Strapi
  # directly, same as shell's federation-manifest fetch) -- the real
  # public Ingress hostname from mfe-pot-platform's charts/strapi, not
  # in-cluster Service DNS.
  runtimeConfig:
    jobBankBffBaseUrl: ""
    strapiBaseUrl: "http://cms.mfe-pot.local"
    # Browser-reachable Ingress host, not in-cluster Service DNS (contrast
    # with backend.env's OTEL_EXPORTER_OTLP_ENDPOINT below) -- see
    # mfe-pot-platform/charts/otel-collector.
    otelExporterOtlpEndpoint: "http://otel.mfe-pot.local"

backend:
  name: job-bank-bff
  # 1 on kind, 2 on EKS (values-eks.yaml) -- see frontend.replicaCount above.
  replicaCount: 1
  readinessPath: /ready
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  image:
    repository: mfe-pot-job-bank-bff
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 3001
  servicePort: 3001
  # session-cache is a separate Helm release in mfe-pot-platform (see its
  # charts/session-cache), installed once independently of any per-app
  # chart -- genuine cross-Helm-release in-cluster Service DNS.
  # MOCK_IDP_JWKS_URL/MOCK_IDP_ISSUER point at mfe-pot-platform's
  # charts/mock-idp release's own in-cluster Service DNS -- server-to-server
  # JWT verification traffic, same pattern as REDIS_URL below. MOCK_IDP_ISSUER
  # must match mock-idp's own chart value exactly (it's the `iss` claim
  # mock-idp bakes into every token).
  env:
    HOST: "0.0.0.0"
    PORT: "3001"
    REDIS_URL: "redis://session-cache.default.svc.cluster.local:6379"
    MOCK_IDP_JWKS_URL: "http://mock-idp.default.svc.cluster.local:3005/.well-known/jwks.json"
    MOCK_IDP_ISSUER: "http://mock-idp.default.svc.cluster.local:3005"
    # otel-collector is a separate Helm release in mfe-pot-platform (see its
    # charts/otel-collector), same cross-Helm-release in-cluster Service DNS
    # pattern as REDIS_URL above -- identical on kind and EKS, so this isn't
    # overridden in values-eks.yaml.
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.default.svc.cluster.local:4318"
    OTEL_SERVICE_NAME: "job-bank-bff"

ingress:
  host: job-bank-mfe.mfe-pot.local
  className: nginx
  # TLS is off by default (kind/local has no real cert authority) --
  # values-eks.yaml turns this on for a real AWS deployment. See
  # templates/ingress.yaml for how these two fields are consumed.
  tls:
    enabled: false
    clusterIssuer: letsencrypt-staging
